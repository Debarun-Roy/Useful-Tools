name: Backend Support B0
on: [push, pull_request, workflow_dispatch]
jobs:
  certify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Pin npm
        run: npm install --global npm@11.13.0
      - name: Certify B0
        run: python scripts/b0/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b0-evidence
          include-hidden-files: true
          path: |
            docs/backend-support/b0/evidence.json
            docs/backend-support/b0/sprint-pass.md
            .b0/**/*.log
            .b0/**/frontend.png
            Useful-Tools/target/surefire-reports/*.xml
            spikes/backend-support/java-servlet/target/*-reports/*.xml

name: Backend Support B6
on: [push, pull_request, workflow_dispatch]
jobs:
  certify:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Certify B6 with B5 through B0 regressions
        run: python -X utf8 scripts/b6/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b6-evidence
          include-hidden-files: true
          path: |
            docs/backend-support/b6/evidence.json
            docs/backend-support/b6/sprint-pass.md
            .b6/*/*.log
            .b6/*/b5-regression-evidence.json
            .b6/**/*-results.json
            .b6/*/exports/*.png
            .b6/*/applications/**/browser-client.png
            Useful-Tools/target/surefire-reports/*.xml

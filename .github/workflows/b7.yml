name: Backend Support B7
on: [push, pull_request, workflow_dispatch]
jobs:
  certify:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Qualify B7 engineering with B0 through B6 regressions
        run: python -X utf8 scripts/b7/verify.py --browser-channel chrome --engineering-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b7-engineering-evidence
          include-hidden-files: true
          path: |
            docs/backend-support/b7/evidence.json
            docs/backend-support/b7/sprint-pass.md
            docs/backend-support/b7/*-report.md
            .b7/*/progress.json
            .b7/*/*.log
            .b7/*/current-b6-evidence.json
            .b7/**/*-results.json
            .b7/**/dependency-scan.json
            .b7/**/npm-assessment.json
            .b7/**/secret-scan.json
            .b7/*/local/*.png
            .b7/*/input-files.json
            .b7/**/dependency-inventory.json
            .b7/**/npm-audit.json
            .b7/*/resume-validation.json
            .b5/**/auth-performance-results.json
            .b6/**/auth-performance-results.json

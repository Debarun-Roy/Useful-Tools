name: Backend Support B3
on: [push, pull_request, workflow_dispatch]
jobs:
  certify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Certify B3 with B2, B1 and B0 regressions
        run: python -X utf8 scripts/b3/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b3-evidence
          include-hidden-files: true
          path: |
            docs/backend-support/b3/evidence.json
            docs/backend-support/b3/sprint-pass.md
            .b3/*/*.log
            .b3/*/application/server.log
            .b3/**/*-results.json
            .b3/*/b2-regression-evidence.json
            .b3/*/application/*.png
            Useful-Tools/target/surefire-reports/*.xml

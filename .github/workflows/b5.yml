name: Backend Support B5
on: [push, pull_request, workflow_dispatch]
jobs:
  certify:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Certify B5 with B4 through B0 regressions
        run: python -X utf8 scripts/b5/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b5-evidence
          include-hidden-files: true
          path: |
            docs/backend-support/b5/evidence.json
            docs/backend-support/b5/sprint-pass.md
            .b5/*/*.log
            .b5/*/b4-regression-evidence.json
            .b5/**/*-results.json
            .b5/*/exports/*.png
            .b5/*/applications/**/browser-client.png
            Useful-Tools/target/surefire-reports/*.xml

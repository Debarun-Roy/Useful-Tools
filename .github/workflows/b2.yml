name: Backend Support B2
on: [push, pull_request, workflow_dispatch]
jobs:
  certify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Certify B2 with B1 and B0 regressions
        run: python -X utf8 scripts/b2/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-evidence
          include-hidden-files: true
          path: |
            docs/backend-support/b2/evidence.json
            docs/backend-support/b2/sprint-pass.md
            .b2/*/*.log
            .b2/*/application/server.log
            .b2/**/*-results.json
            .b2/*/b1-regression-evidence.json
            .b2/*/application/*.png
            Useful-Tools/target/surefire-reports/*.xml

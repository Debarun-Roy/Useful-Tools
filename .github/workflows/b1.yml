name: Backend Support B1
on: [push, pull_request, workflow_dispatch]
jobs:
  certify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Pin npm
        run: npm install --global npm@11.13.0
      - name: Certify B1 and B0 regressions
        run: python -X utf8 scripts/b1/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-evidence
          include-hidden-files: true
          path: |
            docs/backend-support/b1/evidence.json
            docs/backend-support/b1/sprint-pass.md
            .b1/**/*.log
            .b1/**/*-results.json
            .b1/**/b0-regression-evidence.json
            .b1/**/b0-regression-sprint-pass.md
            .b1/**/*.png
            Useful-Tools/target/surefire-reports/*.xml

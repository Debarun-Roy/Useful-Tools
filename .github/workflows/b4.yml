name: Backend Support B4
on: [push, pull_request, workflow_dispatch]
jobs:
  certify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Certify B4 with B3, B2, B1 and B0 regressions
        run: python -X utf8 scripts/b4/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b4-evidence
          include-hidden-files: true
          path: |
            docs/backend-support/b4/evidence.json
            docs/backend-support/b4/sprint-pass.md
            .b4/*/*.log
            .b4/*/application/server.log
            .b4/**/*-results.json
            .b4/*/b3-regression-evidence.json
            .b4/*/application/*.png
            Useful-Tools/target/surefire-reports/*.xml
